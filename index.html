<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clock Widget</title>
  <style>
 :root{
  --text: #ffffff;        /* Reiner Weißton für Dark Mode */
  --muted: #cccccc;       /* Hellgrau für Datum & TZ */
}

*{ box-sizing:border-box; }

html, body{
  height:100%;
  margin:0;
  background: transparent !important;
}

body{
  display:grid;
  place-items:center;
  background: transparent !important;
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

/* Widget komplett transparent */
.widget{
  width: min(520px, 92vw);
  padding: 0;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}

/* Uhr */
.time{
  text-align:center;
  font-variant-numeric: tabular-nums;
  letter-spacing: .08em;
  line-height: 1.0;
  font-weight: 720;
  font-size: clamp(56px, 10vw, 96px);
  color: var(--text);
}

/* Datum + Zeitzone */
.row{
  margin-top: 10px;
  display:flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
}

/* Pills komplett transparent */
.pill{
  padding: 7px 10px;
  border-radius: 1px;
  border: none !important;
  background: transparent !important;
  white-space: nowrap;
  overflow:hidden;
  text-overflow: ellipsis;
  max-width: 70%;
  color: var(--muted);
}

.pill.accent{
  border: none !important;
  background: transparent !important;
}

  </style>
</head>

<body>
  <div class="widget" role="group" aria-label="Trading Uhr">
    <div class="time" id="time">00:00</div>

    <div class="row">
      <div class="pill accent" id="date">—</div>
      <div class="pill" id="tz">—</div>
    </div>
  </div>

  <script>
    // Einstellungen (minimalistisch):
    const SHOW_SECONDS = true;   // false => HH:MM
    const SHOW_DATE    = true;   // false => Datum ausblenden
    const LOCALE       = "de-DE";

    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const tzEl   = document.getElementById("tz");

    function pad(n){ return String(n).padStart(2,"0"); }

    function render(){
      const now = new Date();
      const hh = pad(now.getHours());
      const mm = pad(now.getMinutes());
      const ss = pad(now.getSeconds());

      timeEl.textContent = SHOW_SECONDS ? `${hh}:${mm}:${ss}` : `${hh}:${mm}`;

      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Local";
      tzEl.textContent = tz;

      if (SHOW_DATE){
        const df = new Intl.DateTimeFormat(LOCALE, {
          weekday: "short", day: "2-digit", month: "2-digit", year: "numeric"
        });
        dateEl.textContent = df.format(now);
        dateEl.style.display = "";
      } else {
        dateEl.style.display = "none";
      }
    }

    render();
    // Update “weich” aber stabil:
    setInterval(render, 250);
  </script>
</body>
</html>
