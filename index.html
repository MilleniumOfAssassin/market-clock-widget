<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clock Widget</title>
  <style>
    :root{
      --bg: #2f3437;
      --panel: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.60);
      --accent: #2f3437;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }

    body{
      display:grid;
      place-items:center;
      background: radial-gradient(700px 500px at 25% 20%, rgba(124,92,255,.18), transparent 55%),
                  radial-gradient(700px 500px at 80% 30%, rgba(0,220,255,.10), transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .widget{
      width: min(520px, 92vw);
      border-radius: 18px;
      padding: 18px 18px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 55px rgba(0,0,0,.45);
    }

    .time{
      text-align:center;
      font-variant-numeric: tabular-nums;
      letter-spacing: .08em;
      line-height: 1.0;
      font-weight: 720;
      font-size: clamp(56px, 10vw, 96px);
    }

    .row{
      margin-top: 10px;
      display:flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill{
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.12);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .pill.accent{
      border-color: rgba(124,92,255,.25);
    }
  </style>
</head>

<body>
  <div class="widget" role="group" aria-label="Trading Uhr">
    <div class="time" id="time">00:00</div>

    <div class="row">
      <div class="pill accent" id="date">—</div>
      <div class="pill" id="tz">—</div>
    </div>
  </div>

  <script>
    // Einstellungen (minimalistisch):
    const SHOW_SECONDS = true;   // false => HH:MM
    const SHOW_DATE    = true;   // false => Datum ausblenden
    const LOCALE       = "de-DE";

    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const tzEl   = document.getElementById("tz");

    function pad(n){ return String(n).padStart(2,"0"); }

    function render(){
      const now = new Date();
      const hh = pad(now.getHours());
      const mm = pad(now.getMinutes());
      const ss = pad(now.getSeconds());

      timeEl.textContent = SHOW_SECONDS ? `${hh}:${mm}:${ss}` : `${hh}:${mm}`;

      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Local";
      tzEl.textContent = tz;

      if (SHOW_DATE){
        const df = new Intl.DateTimeFormat(LOCALE, {
          weekday: "short", day: "2-digit", month: "2-digit", year: "numeric"
        });
        dateEl.textContent = df.format(now);
        dateEl.style.display = "";
      } else {
        dateEl.style.display = "none";
      }
    }

    render();
    // Update “weich” aber stabil:
    setInterval(render, 250);
  </script>
</body>
</html>
