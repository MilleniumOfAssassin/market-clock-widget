<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Clock Widget</title>

<style>
:root{
  --text: #ffffff;
  --muted: #cccccc;
}

*{ box-sizing:border-box; }

html, body{
  height:100%;
  margin:0;
  background: transparent !important;
}

body{
  display:grid;
  place-items:center;
  background: transparent !important;
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

.widget{
  width: min(520px, 92vw);
  padding: 0;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}

.zone{
  text-align:center;
  margin-bottom: 18px;
}

.city{
  font-size: 18px;
  color: var(--muted);
  margin-bottom: 4px;
}

.time{
  font-variant-numeric: tabular-nums;
  letter-spacing: .08em;
  line-height: 1.0;
  font-weight: 700;
  font-size: clamp(40px, 8vw, 70px);
  color: var(--text);
}
</style>
</head>

<body>
<div class="widget">

  <div class="zone">
    <div class="city">New York</div>
    <div class="time" id="ny">00:00:00</div>
  </div>

  <div class="zone">
    <div class="city">Berlin</div>
    <div class="time" id="berlin">00:00:00</div>
  </div>

  <div class="zone">
    <div class="city">London</div>
    <div class="time" id="london">00:00:00</div>
  </div>

  <div class="zone">
    <div class="city">Tokio</div>
    <div class="time" id="tokyo">00:00:00</div>
  </div>

</div>

<script>
function render(){
  const zones = {
    ny:    "America/New_York",
    berlin:"Europe/Berlin",
    london:"Europe/London",
    tokyo: "Asia/Tokyo"
  };

  for (const id in zones){
    const now = new Date();
    const fmt = new Intl.DateTimeFormat("de-DE", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false,
      timeZone: zones[id]
    });

    document.getElementById(id).textContent = fmt.format(now);
  }
}

render();
setInterval(render, 250);
</script>

</body>
</html>
