<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Clock</title>
  <style>
    html, body { height: 100%; margin: 0; background: transparent; }
    * { box-sizing: border-box; }

    :root{
      --text: rgba(15, 23, 42, .92);     /* dunkel (für weißen Embed) */
      --muted: rgba(15, 23, 42, .55);
      --panel: rgba(255,255,255,.72);    /* leichtes Panel */
      --border: rgba(15, 23, 42, .12);
    }

    body{
      display:grid;
      place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--text);
    }

    .widget{
      width: min(720px, 96vw);
      padding: 10px;
      background: transparent;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card{
      border-radius: 14px;
      padding: 10px 10px 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .city{
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .time{
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .06em;
      font-weight: 750;
      font-size: clamp(22px, 3.2vw, 34px);
      line-height: 1.05;
    }

    @media (max-width: 620px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>
  <div class="widget" role="group" aria-label="Trading Zeitzonen Uhr">
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const CLOCKS = [
      { label: "New York", tz: "America/New_York" },
      { label: "London",   tz: "Europe/London" },
      { label: "Berlin",   tz: "Europe/Berlin" },
      { label: "Tokio",    tz: "Asia/Tokyo" },
    ];

    const SHOW_SECONDS = true;
    const LOCALE_TIME = "de-DE";

    const grid = document.getElementById("grid");

    function makeCard({label, tz}){
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="city">${label}</div>
        <div class="time" data-tz="${tz}">--:--</div>
      `;
      return card;
    }

    CLOCKS.forEach(c => grid.appendChild(makeCard(c)));

    function fmtTime(tz){
      return new Intl.DateTimeFormat(LOCALE_TIME, {
        timeZone: tz,
        hour: "2-digit",
        minute: "2-digit",
        ...(SHOW_SECONDS ? { second: "2-digit" } : {}),
        hour12: false
      }).format(new Date());
    }

    function render(){
      document.querySelectorAll(".time[data-tz]").forEach(el => {
        el.textContent = fmtTime(el.getAttribute("data-tz"));
      });
    }

    render();
    setInterval(render, 250);
  </script>
</body>
</html>
